openapi: "3.1.0"
info:
  title: "Task Management API - Feature 1: Basics"
  description: "Basic CRUD operations for tasks"
  version: "1.0.0"
servers:
  - url: "http://localhost:3001"
paths:
  /api/tasks:
    get:
      summary: "Get all tasks"
      responses:
        "200":
          description: "List of tasks"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: "Create a new task"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                  example: "New Task"
                description:
                  type: string
                  example: "Task description"
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
      responses:
        "201":
          description: "Task created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}:
    get:
      summary: "Get task by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Task found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: "Task not found"
    put:
      summary: "Update a task"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - completed
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
      responses:
        "200":
          description: "Task updated"
        "404":
          description: "Task not found"
    delete:
      summary: "Delete a task"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Task deleted"
        "404":
          description: "Task not found"
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
        priority:
          type: string
          enum:
            - low
            - medium
            - high
        createdAt:
          type: string
        updatedAt:
          type: string
