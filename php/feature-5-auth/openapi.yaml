openapi: "3.1.0"
info:
  title: "Task Management API - Feature 2: Validation"
  description: "CRUD with request validation"
  version: "1.0.0"
servers:
  - url: "http://localhost:3002"
paths:
  /api/tasks:
    get:
      summary: "Get all tasks"
      responses:
        "200":
          description: "List of tasks"
    post:
      summary: "Create a new task with validation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
      responses:
        "201":
          description: "Task created"
        "400":
          description: "Validation error"
  /api/tasks/{id}:
    get:
      summary: "Get task by ID"
      responses:
        "200":
          description: "Task found"
        "404":
          description: "Task not found"
    put:
      summary: "Update a task with validation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - completed
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
      responses:
        "200":
          description: "Task updated"
        "400":
          description: "Validation error"
        "404":
          description: "Task not found"
    delete:
      summary: "Delete a task"
      responses:
        "204":
          description: "Task deleted"
        "404":
          description: "Task not found"
