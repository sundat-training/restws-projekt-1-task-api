services:
  task-api-complete:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-api-complete
    ports:
      - "3006:3000"
    volumes:
      - .:/workspaces/feature-complete
      - node_modules:/workspaces/feature-complete/node_modules
    working_dir: /workspaces/feature-complete
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:

networks:
  default:
    name: restws-network
