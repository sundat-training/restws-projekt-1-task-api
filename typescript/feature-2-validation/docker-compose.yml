services:
  task-api-validation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-api-validation
    ports:
      - "3002:3000"
    volumes:
      - .:/workspaces/feature-2-validation
      - node_modules:/workspaces/feature-2-validation/node_modules
    working_dir: /workspaces/feature-2-validation
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:

networks:
  default:
    name: restws-network
