services:
  task-api-basics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-api-basics
    ports:
      - "3001:3000"
    volumes:
      - .:/workspaces/feature-1-basics
      - node_modules:/workspaces/feature-1-basics/node_modules
    working_dir: /workspaces/feature-1-basics
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:

networks:
  default:
    name: restws-network
