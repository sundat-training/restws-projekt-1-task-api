services:
  task-api-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-api-auth
    ports:
      - "3005:3000"
    volumes:
      - .:/workspaces/feature-5-auth
      - node_modules:/workspaces/feature-5-auth/node_modules
    working_dir: /workspaces/feature-5-auth
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:

networks:
  default:
    name: restws-network
